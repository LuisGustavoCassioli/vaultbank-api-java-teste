version: '3.8'

services:
  db:
    image: postgres:16
    container_name: vaultbank-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12042005
      POSTGRES_DB: vaultbank
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vaultbank-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/vaultbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12042005
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
